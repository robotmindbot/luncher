Categories:
  - Launcher
License: MIT
AuthorName: Robotmind
SourceCode: https://github.com/robotmindbot/luncher
IssueTracker: https://github.com/robotmindbot/luncher/issues
Summary: Minimal home screen with searchable apps and aliases
Description: |-
  Luncher is a minimal Android home screen with a searchable list of installed
  apps.

  * Search installed apps by name or alias.
  * Set home screen shortcuts and aliases.
  * Optionally show the next calendar event with configurable title filters.

  App discovery uses QUERY_ALL_PACKAGES so the launcher can list installed
  apps. Calendar access is optional and requested only when its setting is
  enabled. There are no ads, analytics, or crash reporting.
RepoType: git
Repo: https://github.com/robotmindbot/luncher
Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 554d66f785862e12af80f3357703151abbe0541b
    sudo:
      - apt-get update
      - apt-get install -y npm
    init:
      - npm ci --no-audit --no-fund
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf '{}' +
    prebuild:
      - npx expo prebuild --platform android --clean --no-install
      - sed -i '/signingConfig /d' android/app/build.gradle
    build:
      - cd android && NODE_ENV=production gradle assembleRelease
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
MaintainerNotes: |-
  Android project files are generated by Expo prebuild. Expo modules are built
  from source through the expo.autolinking.android.buildFromSource setting in
  package.json. Local Maven repositories bundled with npm packages are removed
  before source scan.
